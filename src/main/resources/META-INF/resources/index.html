<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" type="image/png" href="favicon.ico">

    <script src="/_importmap/dynamic-importmap.js"></script>

    <script type="module">
        import 'icons/font-awesome.js';
        import 'components/demo-title.js';
        import 'components/demo-chat.js';
        import 'wc-chatbot';
    </script>

    <link rel="stylesheet" href="fonts/red-hat-font.min.css">

    <title>Code menthoring knowledge base</title>

    <style>
        :root {
            --main-bg-color: rgb(246, 242, 242);
            --main-highlight-text-color: #2196F3; /* blue */
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            font-family: 'Red Hat Text', sans-serif;
            color: var(--lumo-body-text-color);
            background: var(--main-bg-color);
        }

        /* Layout: title on top, central chat area vertically centered */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
        }

        /* Middle region grows and centers its content */
        .middle {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1.5rem 1rem;
            box-sizing: border-box;
        }

        /* Card-like chat container in the center */
        .chat-container {
            width: 720px;
            max-width: 96%;
            height: 72vh;
            min-height: 480px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Layout inside the card: header, main chat area, output */
        .chat-header {
            height: 64px;
            min-height: 64px;
            background: linear-gradient(90deg,#1976D2,#2196F3);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            font-weight: 600;
            gap: 0.75rem;
        }

        .chat-main {
            flex: 1 1 auto;
            display: block;
            position: relative;
            min-height: 0; /* allow flex children to shrink properly */
        }

        .chat-output {
            height: 140px;
            min-height: 84px;
            border-top: 1px solid rgba(0,0,0,0.06);
            background: linear-gradient(180deg, rgba(250,250,250,0.8), #fff);
            padding: 0.75rem 1rem;
            box-sizing: border-box;
            overflow: auto;
            font-size: 14px;
            color: #333;
        }

        /* Ensure demo-chat and chat-bot occupy the available main area */
        .chat-main demo-chat {
            width: 100%;
            height: 100%;
            display: block;
        }

        .chat-main demo-chat chat-bot {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Chatbot theme variables */
        chat-bot {
            --chatbot-avatar-bg-color: #1976D2; /* darker blue */
            --chatbot-avatar-margin: 10%;
            --chatbot-header-bg-color: #1976D2;
            --chatbot-header-title-color: #FFFFFF;
            --chatbot-body-bg-color: var(--main-bg-color);
            --chatbot-send-button-color: #2196F3;
        }

        chat-bot::part(chat-bubble) {
            --chat-bubble-avatar-color: #1976D2;
            --chat-bubble-color: rgba(203, 232, 255, 0.95); /* light blue bubble */
            --chat-bubble-right-color: rgb(173, 216, 230);
            --chat-bubble-font-color: #333;
            --chat-bubble-font-right-color: #333;
            --chat-bubble-delay: 0.2s;
        }

        /* Hide external floating chatbot launcher (wc-chatbot) so central chat is used */
        wc-chatbot,
        wc-chatbot *,
        .wc-chatbot,
        .wc-chatbot * {
            display: none !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

    </style>
</head>

<body>

<demo-title></demo-title>

<div class="middle">
    <div class="chat-container">
        <div class="chat-header">Customer Support — Code Mentoring</div>
        <div class="chat-main">
            <demo-chat>
                <chat-bot></chat-bot>
            </demo-chat>
        </div>
        <div class="chat-output" id="chat-output">
            Responses and system output will appear here.
        </div>
    </div>
</div>

</body>

</html>
